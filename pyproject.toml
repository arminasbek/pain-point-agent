[project]
name = "pain-point-agent"
version = "1.0.0"
description = "Agent that finds what people in a niche struggle with in public forums, backed by verified quotes"
readme = "README.md"
authors = [
    { name = "Arminas B.", email = "git@abek.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
pain-point-agent = "pain_point_agent.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
